name: OrangeHRM Selenium Tests

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v2

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        env:
          HEADLESS: "true"
        run: pytest tests/ -v
        continue-on-error: true
        id: pytest

      - name: Get Allure report history
        uses: actions/checkout@v4
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Ensure gh-pages history folder exists
        if: always()
        run: mkdir -p gh-pages

      - name: Generate Allure report
        uses: simple-elf/allure-report-action@v1.15
        if: always()
        with:
          allure_results: allure-results
          gh_pages: gh-pages
          allure_report: allure-report
          allure_history: allure-history

      - name: Fix ownership of generated Allure report
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" allure-history

      - name: Add pytest-html report alongside Allure report
        if: always()
        run: cp reports/report.html allure-history/pytest-html-report.html

      - name: Deploy reports to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history

      - name: Fail job if tests failed
        if: steps.pytest.outcome == 'failure'
        run: exit 1

  cross_browser:
    # Fast, proven-stable subset only (login + client-side form validation,
    # neither of which touch the flaky search endpoints) across Chrome and
    # Firefox. Running the full 100+ test suite on both browsers would
    # roughly double the load this workflow already puts on the shared
    # public demo, for coverage this smoke subset already proves.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Chrome
        if: matrix.browser == 'chrome'
        uses: browser-actions/setup-chrome@v2

      - name: Set up Firefox
        if: matrix.browser == 'firefox'
        uses: browser-actions/setup-firefox@v1

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run cross-browser smoke tests
        env:
          HEADLESS: "true"
          BROWSER: ${{ matrix.browser }}
        run: pytest tests/test_login.py tests/test_negative_validation.py -v
